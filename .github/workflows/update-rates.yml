name: Update rates

# Refreshes rates.json once a day (and on demand: Actions -> Update rates -> Run workflow).
# The app reads rates.json from this repo (raw.githubusercontent.com), so phones never call a rates service themselves.
# Source: open.er-api.com (free, no key, ~160 currencies, updated daily), with the jsDelivr currency-api as a fallback.
# To support one more currency in the app, add its code to CURRENCIES in index.html and to CODES below.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rates
  cancel-in-progress: false

jobs:
  rates:
    runs-on: ubuntu-latest
    env:
      CODES: "USD EGP SAR AED KWD QAR BHD OMR JOD ILS EUR GBP"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch rates
        run: |
          set -euo pipefail
          WANT=$(printf '%s\n' $CODES | jq -R . | jq -s .)
          NOW=$(date +%s)
          fetch_primary() {
            curl -fsS --max-time 30 https://open.er-api.com/v6/latest/USD > primary.json \
            && jq -e '.result == "success"' primary.json > /dev/null \
            && jq --argjson want "$WANT" --argjson now "$NOW" '
              {base:"USD", updated:$now,
               rates:(.rates | with_entries(select(.key as $k | $want | index($k)))
                       | map_values(. * 1000000 | round / 1000000))}' primary.json > new.json
          }  # (chained with && on purpose: set -e does not apply inside a function used before ||)
          fetch_fallback() {
            curl -fsS --max-time 30 https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json > fallback.json \
            && jq --argjson want "$WANT" --argjson now "$NOW" '
              {base:"USD", updated:$now,
               rates:(.usd | with_entries(.key |= ascii_upcase)
                       | with_entries(select(.key as $k | $want | index($k)))
                       | map_values(. * 1000000 | round / 1000000))}' fallback.json > new.json
          }
          fetch_primary || { echo "::warning::primary source failed, using the fallback"; fetch_fallback; }
          # every currency we ship must be there and be a positive number, otherwise keep the old file
          jq -e --argjson want "$WANT" '. as $f | $want | all(. as $c | ($f.rates[$c] // 0) > 0)' new.json > /dev/null \
            || { echo "::error::rates.json would miss a currency, keeping the old one"; exit 1; }
          jq --sort-keys . new.json > rates.json
          cat rates.json

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.json
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "rates.json: $(date -u +%F) [skip ci]"
          git pull --rebase origin main
          git push origin main
