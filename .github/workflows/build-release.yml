name: Build release

# Publishing a GitHub Release (Releases -> Draft a new release -> tag like v1.1 -> Publish) builds the signed APK,
# attaches it to that Release, and points update.json at it, so the app offers the update by itself.
# "Run workflow" by hand only builds (APK + AAB as Artifacts) without publishing anything.
on:
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write   # attach the APK to the Release and commit update.json

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the secret KEYSTORE_BASE64 first (see README)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed AAB and APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: upload
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.event.release.tag_name }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Upload AAB (only needed for Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: Maleem-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload signed APK (for your phone)
        uses: actions/upload-artifact@v4
        with:
          name: Maleem-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Attach the APK to the Release and update update.json
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          RUN: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          CODE=$((RUN + 100))   # the same versionCode build.gradle.kts gave this APK
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          OUT="Maleem-${TAG}.apk"
          cp "$APK" "$OUT"
          SHA=$(sha256sum "$OUT" | cut -d' ' -f1)
          gh release upload "$TAG" "$OUT" --clobber --repo "$REPO"
          URL="https://github.com/${REPO}/releases/download/${TAG}/${OUT}"
          # what you wrote in the Release description is shown in the app as "what's new"
          NOTES=$(gh release view "$TAG" --repo "$REPO" --json body -q .body)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          [ -f update.json ] || echo '{"latest":{},"minCode":0,"message":{"id":"","text":""}}' > update.json
          jq --argjson code "$CODE" --arg name "${TAG#v}" --arg apk "$URL" --arg sha "$SHA" --arg notes "$NOTES" \
            '.latest = {code: $code, name: $name, apk: $apk, sha256: $sha, notes: ($notes | .[0:1500])}' update.json > update.tmp
          mv update.tmp update.json
          git add update.json
          git commit -m "update.json: ${TAG} [skip ci]"
          git push origin main
          echo "### Published ${TAG} (versionCode ${CODE})" >> "$GITHUB_STEP_SUMMARY"
          echo "APK: ${URL}" >> "$GITHUB_STEP_SUMMARY"
