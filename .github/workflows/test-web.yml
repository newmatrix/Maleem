name: Web regression tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix tests --ignore-scripts
      - run: npx --prefix tests playwright install --with-deps chromium
      - run: node tests/regression.cjs
      - run: node tests/full-audit.cjs
      - run: node tests/journeys.cjs
      - run: node tests/language-dialogs.cjs
      - run: node tests/layout-static.cjs
      - run: node tests/floating-actions.cjs
      - run: node tests/income-funding.cjs
      - run: node tests/funding-capsule.cjs
      - run: node tests/restore-recurring.cjs
      - run: node tests/review-plan-bug.cjs
      - run: node tests/account-menu.cjs
      - run: node tests/expense-time.cjs
      - run: node tests/expense-filters.cjs
      - run: node tests/home-month.cjs
      - run: node tests/category-report.cjs
      - run: node tests/recurrence-expanded.cjs
      - run: node tests/debt-currency.cjs
      - run: node tests/income-history.cjs
      - run: node tests/post-review-fixes.cjs
      - run: node tests/home-chips.cjs
      - run: node tests/nudge.cjs
      - run: node tests/i18n-coverage.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-results
          path: |
            tests/*-results.json
            tests/results.json
            tests/full-audit-results.json
            tests/journey-results.json
            tests/layout-static-results.json
            tests/floating-actions-results.json
            tests/income-funding-results.json
            tests/funding-capsule-results.json
            tests/restore-recurring-results.json
            dynamic-language-results.json
  native-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and test notification parsing
        run: |
          curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors --max-time 600 https://github.com/JetBrains/kotlin/releases/download/v2.1.21/kotlin-compiler-2.1.21.zip -o "$RUNNER_TEMP/kotlin.zip"
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP/kotlin"
          "$RUNNER_TEMP/kotlin/kotlinc/bin/kotlinc" app/src/main/java/com/heshamtaha/maleem/PayParser.kt app/src/main/java/com/heshamtaha/maleem/CaptureIdentity.kt app/src/main/java/com/heshamtaha/maleem/NativeLanguage.kt tests/NativeRegression.kt -include-runtime -d "$RUNNER_TEMP/native-tests.jar"
          java -jar "$RUNNER_TEMP/native-tests.jar"
